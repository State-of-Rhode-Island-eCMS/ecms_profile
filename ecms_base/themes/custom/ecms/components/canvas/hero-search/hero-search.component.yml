$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 'Hero: Search'
group: RI.Gov
description: 'Search-bar hero for a single landing page (not the default page hero). Full-bleed photo banner with wave bottom, overlaid h1, and a navy bar below for a search form, icon links, and a lower slot (intended for tabs). Image is randomized client-side per page load from the manifest inlined in hero-search.twig; the location label in the top-right travels with the chosen image.'
props:
  type: object
  properties:
    title:
      title: Heading text
      type: string
slots:
  search_box:
    title: Search form block
  icon_links:
    title: Icon link items (one or more canvas/icon-link components)
  footer:
    title: Footer slot (full-width to max container — intended for tabs)
libraryOverrides:
  js:
    hero-search.js: {}
  dependencies:
    - core/drupal
    - core/once
