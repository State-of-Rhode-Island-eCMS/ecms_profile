name: 'ECMS Canvas'
description: 'Standardized Drupal Canvas base configuration'
type: 'content'
recipes:
  - ecms_role_content_author
  - ecms_role_content_publisher
  - ecms_role_site_admin
  - ecms_role_drupal_admin
install:
  - canvas
  - image
  - views
  - user
  - system
config:
  strict: false
  import:
    canvas:
      - canvas.asset_library.global
      - canvas.brand_kit.global
      - editor.editor.canvas_html_block
      - editor.editor.canvas_html_inline
      - filter.format.canvas_html_block
      - filter.format.canvas_html_inline
      - image.style.canvas_avatar
      - image.style.canvas_parametrized_width
      # Canvas ships this view in config/optional and recipes only import the
      # module config they list. Without it, /admin/content/pages falls back to
      # the bare entity list builder, which shows no page titles.
      - views.view.canvas_pages
  actions:
    canvas.component.sdc.*.*:
      setStatus: false

    user.role.content_author:
      grantPermissions:
        - 'create canvas_page'
        - 'edit canvas_page'
        - 'delete canvas_page'
        - 'publish auto-saves'
    user.role.content_publisher:
      grantPermissions:
        - 'create canvas_page'
        - 'edit canvas_page'
        - 'delete canvas_page'
        - 'publish auto-saves'
    user.role.site_admin:
      grantPermissions:
        - 'administer components'
        - 'administer code components'
        - 'administer folders'
        - 'administer patterns'
        - 'administer page template'
        - 'administer content templates'
        - 'administer brand kit'
        - 'create canvas_page'
        - 'edit canvas_page'
        - 'delete canvas_page'
        - 'publish auto-saves'
    user.role.drupal_admin:
      grantPermissions:
        - 'administer components'
        - 'administer code components'
        - 'administer folders'
        - 'administer patterns'
        - 'administer page template'
        - 'administer content templates'
        - 'administer brand kit'
        - 'create canvas_page'
        - 'edit canvas_page'
        - 'delete canvas_page'
        - 'publish auto-saves'
