name: eCMS News
type: eCMS
description: 'Installs the News content type and related configuration.'
# The agency field originates from the ecms_press_release feature.
#  Need to declare a dependency on it.
install:
  - ecms_press_release
recipes: []
config:
  import:
    ecms_press_release: '*'
    views:
      - views.view.news
    pathauto:
      - pathauto.pattern.news
    simple_sitemap:
      - simple_sitemap.bundle_settings.default.node.news
    rabbit_hole:
      - rabbit_hole.behavior_settings.node_type_news
    node:
      - node.type.news
      - core.base_field_override.node.news.changed
      - core.base_field_override.node.news.created
      - core.base_field_override.node.news.menu_link
      - core.base_field_override.node.news.moderation_state
      - core.base_field_override.node.news.path
      - core.base_field_override.node.news.promote
      - core.base_field_override.node.news.status
      - core.base_field_override.node.news.sticky
      - core.base_field_override.node.news.title
      - core.base_field_override.node.news.uid
    taxonomy:
      - taxonomy.vocabulary.news_topics
      - core.base_field_override.taxonomy_term.news_topics.changed
      - core.base_field_override.taxonomy_term.news_topics.path
      - core.base_field_override.taxonomy_term.news_topics.status
  strict:
    # Field storages affect database schema - treat strictly.
    - field.storage.node.field_meta_tags_news
    - field.storage.node.field_news_body
    - field.storage.node.field_news_date
    - field.storage.node.field_news_links
    - field.storage.node.field_news_paragraphs
    - field.storage.node.field_news_promotions
    - field.storage.node.field_news_source
    - field.storage.node.field_news_topics
  actions:
    # --- Field storage ---
    # The Agency options. field_agency comes from the ecms_press_release
    # feature, and the deployment runs features:import after updatedb, so this
    # list must match that feature's field.storage.node.field_agency.yml or the
    # import will revert it.
    field.storage.node.field_agency:
      setProperties:
        settings.allowed_values:
          - value: administration_department_of
            label: 'Administration, Department of'
          - value: attorney_general_office_of
            label: 'Attorney General, Office of'
          - value: attorney_general_consumer_news_and_alerts
            label: 'Attorney General: Consumer News and Alerts'
          - value: attorney_general_grand_jury_reports
            label: 'Attorney General: Grand Jury Reports'
          - value: attorney_general_open_government
            label: 'Attorney General: Open Government'
          - value: board_of_elections
            label: 'Board of Elections'
          - value: business_regulation_department_of
            label: 'Business Regulation, Department of'
          - value: child_advocate_office_of_the
            label: 'Child Advocate, Office of the'
          - value: contractor_registration_board
            label: 'Contractor Registration Board'
          - value: department_of_children_youth_and_families
            label: 'Department of Children, Youth and Families'
          - value: department_of_corrections
            label: 'Department of Corrections'
          - value: department_of_housing
            label: 'Department of Housing'
          - value: department_of_human_services
            label: 'Department of Human Services'
          - value: department_of_labor_and_training
            label: 'Department of Labor and Training'
          - value: division_of_elderly_affairs
            label: 'Division of Elderly Affairs'
          - value: division_of_municipal_finance
            label: 'Division of Municipal Finance'
          - value: economic_recovery_and_reinvestment_office_of
            label: 'Economic Recovery and Reinvestment, Office of'
          - value: emergency_management_agency
            label: 'Emergency Management Agency'
          - value: en_espanol
            label: 'En Espanol'
          - value: energy_resources_office_of
            label: 'Energy Resources, Office of'
          - value: environmental_management_department_of
            label: 'Environmental Management, Department of'
          - value: ethics_commission
            label: 'Ethics Commission'
          - value: general_treasurer_office_of_the
            label: 'General Treasurer, Office of the'
          - value: governor_mckee_executive_orders
            label: 'Governor McKee Executive Orders'
          - value: governor_mckee_speeches
            label: 'Governor McKee Speeches'
          - value: governor_office_of_the
            label: 'Governor, Office of the'
          - value: health_and_human_services_executive_office_of
            label: 'Health and Human Services, Executive Office of'
          - value: health_department_of
            label: 'Health, Department of'
          - value: health_department_of_beach_monitoring
            label: 'Health, Department of: Beach Monitoring'
          - value: health_department_of_drinking_water
            label: 'Health, Department of: Drinking Public Notice'
          - value: health_department_of_drinking_water_state_revolving_loan_fund
            label: 'Health, Department of: Drinking Water State Revolving Loan Fund'
          - value: historical_preservation_and_heritage_commission
            label: 'Historical Preservation and Heritage Commission'
          - value: labor_and_training_department_of
            label: 'Labor and Training, Department of'
          - value: lt_governor_office_of_the
            label: 'LT. Governor, Office of the'
          - value: minority_business_enterprise
            label: 'Minority Business Enterprise'
          - value: motor_vehicles_division_of
            label: 'Motor Vehicles, Division of'
          - value: office_of_diversity_equity_opportunity
            label: 'Office of Diversity, Equity & Opportunity'
          - value: office_or_the_health_insurance_commissioner
            label: 'Office or the Health Insurance Commissioner'
          - value: public_safety_department_of
            label: 'Public Safety, Department of'
          - value: revenue_department_of
            label: 'Revenue, Department of'
          - value: rhode_island_state_council_on_the_arts
            label: 'Rhode Island State Council on the Arts'
          - value: ri_commerce_corporation
            label: 'RI Commerce Corporation'
          - value: ri_higher_education_assistance_authority
            label: 'RI Higher Education Assistance Authority'
          - value: secretary_of_state_office_of_the
            label: 'Secretary of State, Office of the'
          - value: state_police_of_rhode_island
            label: 'State Police of Rhode Island'
          - value: taxation_division_of
            label: 'Taxation, Division of'
          - value: transportation_department_of
            label: 'Transportation, Department of'
          - value: water_resources_board
            label: 'Water Resources Board'
          - value: other
            label: 'Other'

    # --- Field instances ---
    field.field.node.news.field_agency:
      ensure_exists:
        entity_type: node
        bundle: news
        field_name: field_agency
        field_type: list_string
      setLabel: Agency
      setDescription: 'This field is used for the filter criteria on Ri.gov.'
      setRequired: true
      setTranslatable: false

    field.field.node.news.field_meta_tags_news:
      ensure_exists:
        entity_type: node
        bundle: news
        field_name: field_meta_tags_news
        field_type: metatag
      setLabel: 'Meta Tags News'
      setRequired: false
      setTranslatable: true

    field.field.node.news.field_news_body:
      ensure_exists:
        entity_type: node
        bundle: news
        field_name: field_news_body
        field_type: text_with_summary
      setLabel: Body
      setRequired: true
      setTranslatable: true

    field.field.node.news.field_news_date:
      ensure_exists:
        entity_type: node
        bundle: news
        field_name: field_news_date
        field_type: datetime
      setLabel: Date
      setRequired: true
      setTranslatable: false
      setDefaultValue:
        - default_date_type: now
          default_date: now

    field.field.node.news.field_news_links:
      ensure_exists:
        entity_type: node
        bundle: news
        field_name: field_news_links
        field_type: link
      setLabel: Links
      setRequired: false
      setTranslatable: true

    field.field.node.news.field_news_paragraphs:
      ensure_exists:
        entity_type: node
        bundle: news
        field_name: field_news_paragraphs
        field_type: entity_reference_revisions
      setLabel: 'News Content Components'
      setDescription: 'Add one or more flexible content components.'
      setRequired: false
      setTranslatable: false

    field.field.node.news.field_news_promotions:
      ensure_exists:
        entity_type: node
        bundle: news
        field_name: field_news_promotions
        field_type: entity_reference
      setLabel: 'News Promotions'
      setDescription: 'Assigned promotions will output below the section navigation and any global promotions.'
      setRequired: false
      setTranslatable: false

    field.field.node.news.field_news_source:
      ensure_exists:
        entity_type: node
        bundle: news
        field_name: field_news_source
        field_type: text_long
      setLabel: Source
      setDescription: 'Optional agency and contact information.'
      setRequired: false
      setTranslatable: true

    field.field.node.news.field_news_topics:
      ensure_exists:
        entity_type: node
        bundle: news
        field_name: field_news_topics
        field_type: entity_reference
      setLabel: 'News Topics'
      setDescription: 'Add topics to group news.'
      setRequired: false
      setTranslatable: false

    # --- Language content settings ---
    language.content_settings.node.news:
      ensure_exists:
        target_entity_type_id: node
        target_bundle: news
      setProperties:
        default_langcode: site_default
        language_alterable: true
        third_party_settings:
          content_translation:
            enabled: true
            bundle_settings:
              untranslatable_fields_hide: '1'

    language.content_settings.taxonomy_term.news_topics:
      createIfNotExists:
        langcode: en
        status: true
        id: taxonomy_term.news_topics
        target_entity_type_id: taxonomy_term
        target_bundle: news_topics
        default_langcode: site_default
        language_alterable: true
        third_party_settings:
          content_translation:
            enabled: true
            bundle_settings:
              untranslatable_fields_hide: '1'
      setProperties:
        default_langcode: site_default
        language_alterable: true
        third_party_settings:
          content_translation:
            enabled: true
            bundle_settings:
              untranslatable_fields_hide: '1'

    # --- Entity form display ---
    core.entity_form_display.node.news.default:
      createIfNotExists:
        targetEntityType: node
        bundle: news
        mode: default
        status: true
      setComponents:
        - name: title
          options:
            type: string_textfield
            weight: 0
            region: content
            settings:
              size: 60
              placeholder: ''
        - name: uid
          options:
            type: entity_reference_autocomplete
            weight: 1
            region: content
            settings:
              match_operator: CONTAINS
              match_limit: 10
              size: 60
              placeholder: ''
        - name: created
          options:
            type: datetime_timestamp
            weight: 2
            region: content
            settings: {}
        - name: simple_sitemap
          options:
            weight: 3
            region: content
            settings: {}
        - name: translation
          options:
            weight: 4
            region: content
            settings: {}
        - name: promote
          options:
            type: boolean_checkbox
            weight: 5
            region: content
            settings:
              display_label: true
        - name: sticky
          options:
            type: boolean_checkbox
            weight: 6
            region: content
            settings:
              display_label: true
        - name: path
          options:
            type: path
            weight: 7
            region: content
            settings: {}
        - name: url_redirects
          options:
            weight: 8
            region: content
            settings: {}
        - name: moderation_state
          options:
            type: moderation_state_default
            weight: 9
            region: content
            settings: {}
        - name: status
          options:
            type: boolean_checkbox
            weight: 10
            region: content
            settings:
              display_label: true
        - name: field_news_body
          options:
            type: text_textarea_with_summary
            weight: 11
            region: content
            settings:
              rows: 9
              summary_rows: 3
              placeholder: ''
              show_summary: false
        - name: field_news_date
          options:
            type: datetime_default
            weight: 12
            region: content
            settings: {}
        - name: field_news_links
          options:
            type: link_default
            weight: 13
            region: content
            settings:
              placeholder_url: ''
              placeholder_title: ''
        - name: field_news_source
          options:
            type: text_textarea
            weight: 14
            region: content
            settings:
              rows: 5
              placeholder: ''
        - name: field_news_paragraphs
          options:
            type: entity_reference_paragraphs
            weight: 15
            region: content
            settings:
              title: 'Content Component'
              title_plural: 'Content Components'
              edit_mode: preview
              add_mode: dropdown
              form_display_mode: default
              default_paragraph_type: _none
        - name: field_meta_tags_news
          options:
            type: metatag_firehose
            weight: 16
            region: content
            settings:
              sidebar: true
              use_details: true
        - name: field_agency
          options:
            type: options_buttons
            weight: 17
            region: content
            settings: {}
        - name: publish_on
          options:
            type: datetime_timestamp_no_default
            weight: 30
            region: content
            settings: {}
        - name: unpublish_on
          options:
            type: datetime_timestamp_no_default
            weight: 30
            region: content
            settings: {}

    # --- Entity view displays ---
    core.entity_view_display.node.news.default:
      createIfNotExists:
        targetEntityType: node
        bundle: news
        mode: default
        status: true
      setComponents:
        - name: content_moderation_control
          options:
            weight: 0
            region: content
            settings: {}
        - name: field_news_body
          options:
            type: text_default
            label: above
            weight: 1
            region: content
            settings: {}
        - name: field_news_date
          options:
            type: datetime_default
            label: above
            weight: 2
            region: content
            settings:
              timezone_override: ''
              format_type: medium
        - name: field_news_links
          options:
            type: link
            label: above
            weight: 3
            region: content
            settings:
              trim_length: 80
              url_only: false
              url_plain: false
              rel: ''
              target: ''
        - name: field_news_source
          options:
            type: text_default
            label: above
            weight: 4
            region: content
            settings: {}
        - name: field_news_paragraphs
          options:
            type: entity_reference_revisions_entity_view
            label: above
            weight: 5
            region: content
            settings:
              view_mode: default
              link: ''
        - name: field_news_promotions
          options:
            type: entity_reference_entity_view
            label: hidden
            weight: 7
            region: content
            settings:
              view_mode: teaser
              link: false
        - name: field_meta_tags_news
          options:
            type: metatag_empty_formatter
            label: above
            weight: 8
            region: content
            settings: {}

    core.entity_view_display.node.news.teaser:
      createIfNotExists:
        targetEntityType: node
        bundle: news
        mode: teaser
        status: true
      setComponents:
        - name: field_news_body
          options:
            type: text_summary_or_trimmed
            label: hidden
            weight: 0
            region: content
            settings:
              trim_length: 200
        - name: field_news_date
          options:
            type: datetime_default
            label: hidden
            weight: 1
            region: content
            settings:
              timezone_override: ''
              format_type: medium

    core.entity_view_display.taxonomy_term.news_topics.default:
      createIfNotExists:
        targetEntityType: taxonomy_term
        bundle: news_topics
        mode: default
        status: true
      setComponents:
        - name: description
          options:
            label: hidden
            type: text_default
            weight: 0
            region: content
            settings: {}
