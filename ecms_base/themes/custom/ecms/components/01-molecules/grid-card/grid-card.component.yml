$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Grid Card
group: 'ZZ-Incompatible'
noUi: true
description: A card for use in grid layouts. Supports an image, icon, or stat in the media area.
props:
  type: object
  properties:
    variant:
      type: string
      title: Card variant
      description: Either 'image', 'icon', or 'stat'
      enum:
        - image
        - icon
        - stat
      default: image
slots:
  img:
    title: The rendered responsive image (for image variant)
  icon:
    title: The icon markup (for icon variant)
  media_library_icon:
    title: Whether the icon is from the media library
  stats:
    title: Array of stat items (for stat variant), each with value and description
  theme_class:
    title: Optional theme class for the card surface (e.g. qh__t__primary)
  link_url:
    title: The URL for the card link
  link_text:
    title: The CTA link text
